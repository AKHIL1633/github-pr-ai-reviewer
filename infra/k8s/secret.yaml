# Fill in all values before applying with: kubectl apply -f secret.yaml
# Never commit this file with real values filled in.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: ""
  GITHUB_APP_ID: ""
  GITHUB_APP_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    (paste your private key here, keeping the line breaks)
    -----END RSA PRIVATE KEY-----
  OPENAI_API_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
  DATABASE_URL: ""

